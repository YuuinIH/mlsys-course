<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" aria-labelledby="title desc" role="img" viewBox="0 0 960 500"><title id="title">从一句需求到部门试用</title><desc id="desc">三格故事图。第一格，领导提出先在办公电脑上试试大模型；第二格，工程师在本机成功运行模型；第三格，领导要求第二天开放给部门同事试用，单人演示即将变成多人服务。</desc><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 L10 5 L0 10 Z" class="arrow-head"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;PingFang SC&quot;,sans-serif;fill:#182230}.panel{fill:#fff;stroke:#aeb8c6;stroke-width:2.5}.panel-number{fill:#edf4ff;stroke:#4d77c7}.panel-number,.screen{stroke-width:2.5}.surface{fill:#f5f7fa;stroke:#9aa6b5}.surface,.warm{stroke-width:2.5}.screen{fill:#1d3154;stroke:#7ca6ef}.warm{fill:#fff4df;stroke:#d38a18}.bubble,.success{stroke-width:2.5}.success{fill:#eef8f2;stroke:#4a8c67}.bubble{fill:#fff;stroke:#7b8796}.line,.thin{fill:none;stroke:#5e6b7a;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:#7b8796;stroke-width:2.5}.flow{fill:none;stroke:#4d77c7;stroke-width:4;marker-end:url(#arrow)}.arrow-head{fill:#4d77c7}.heading{font-size:19px;font-weight:700;text-anchor:middle}.label{font-size:16px;font-weight:600}.label,.speech,.sub{text-anchor:middle}.speech{font-size:15px;font-weight:600}.sub{font-size:14px;fill:#5e6b7a}.code{font-size:15px;fill:#dbeafe;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.check{fill:none;stroke:#4a8c67;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}@media (prefers-color-scheme:dark){text{fill:#e9eef5}.bubble,.panel{fill:#202936;stroke:#667386}.panel-number{fill:#1d3154;stroke:#7ca6ef}.surface{fill:#252f3d;stroke:#718095}.screen{fill:#172744;stroke:#7ca6ef}.warm{fill:#4b3718;stroke:#e3a84c}.success{fill:#18372a;stroke:#72b48e}.line{stroke:#aab6c5}.thin{stroke:#91a0b2}.flow{stroke:#7ca6ef}.arrow-head{fill:#7ca6ef}.sub{fill:#bac4d1}.check{stroke:#72b48e}}</style></defs><text x="480" y="34" class="heading">一个本地模型，怎样开始变成一个系统？</text><rect width="275" height="385" x="25" y="58" class="panel" rx="22"/><circle cx="58" cy="91" r="18" class="panel-number"/><text x="58" y="97" class="label">1</text><text x="162.5" y="97" class="heading">一句需求</text><path d="M55 125 H270 Q282 125 282 137 V202 Q282 214 270 214 H194 L178 231 L181 214 H55 Q43 214 43 202 V137 Q43 125 55 125 Z" class="bubble"/><text x="162" y="159" class="speech">不用搞那么复杂，</text><text x="162" y="184" class="speech">先在你电脑上试试。</text><circle cx="92" cy="283" r="22" class="surface"/><path d="M92 305 V362 M92 326 L64 348 M92 326 L124 341 M92 362 L72 399 M92 362 L114 399" class="line"/><circle cx="224" cy="294" r="22" class="surface"/><path d="M224 316 V372 M224 336 L198 354 M224 336 L252 348 M224 372 L207 403 M224 372 L243 403" class="line"/><path d="M60 414 H265" class="thin"/><text x="162.5" y="431" class="sub">会议室里的任务</text><path d="M306 250 H330" class="flow"/><rect width="275" height="385" x="342" y="58" class="panel" rx="22"/><circle cx="375" cy="91" r="18" class="panel-number"/><text x="375" y="97" class="label">2</text><text x="479.5" y="97" class="heading">一次演示</text><rect width="209" height="145" x="375" y="130" class="screen" rx="13"/><circle cx="393" cy="149" r="4" class="warm"/><circle cx="408" cy="149" r="4" class="warm"/><circle cx="423" cy="149" r="4" class="warm"/><text x="399" y="185" class="code">model.generate(</text><text x="422" y="211" class="code">prompt</text><text x="399" y="237" class="code">)</text><path d="M478 275 V295 M435 295 H521" class="line"/><rect width="161" height="72" x="399" y="315" class="success" rx="16"/><path d="M427 350 L443 365 L470 335" class="check"/><text x="511" y="357" class="label">能跑了</text><text x="479.5" y="431" class="sub">办公电脑上的模型</text><path d="M623 250 H647" class="flow"/><rect width="276" height="385" x="659" y="58" class="panel" rx="22"/><circle cx="692" cy="91" r="18" class="panel-number"/><text x="692" y="97" class="label">3</text><text x="797" y="97" class="heading">马上推广</text><path d="M683 125 H911 Q923 125 923 137 V202 Q923 214 911 214 H833 L817 231 L820 214 H683 Q671 214 671 202 V137 Q671 125 683 125 Z" class="bubble"/><text x="797" y="159" class="speech">那你整理一下，</text><text x="797" y="184" class="speech">明天给部门里的人试试。</text><rect width="216" height="118" x="689" y="266" class="warm" rx="18"/><circle cx="727" cy="307" r="15" class="surface"/><circle cx="765" cy="307" r="15" class="surface"/><circle cx="803" cy="307" r="15" class="surface"/><circle cx="841" cy="307" r="15" class="surface"/><path d="M712 345 Q727 329 742 345 M750 345 Q765 329 780 345 M788 345 Q803 329 818 345 M826 345 Q841 329 856 345" class="thin"/><rect width="18" height="18" x="870" y="293" class="screen" rx="4"/><path d="M879 311 V335" class="thin"/><text x="797" y="431" class="sub">单人演示即将面对多人 workload</text></svg>