<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">先在你电脑上试试</title>
  <desc id="desc">领导站在办公桌旁提出先在电脑上部署大模型。工程师坐在显示器前，转头看向桌下的主机。</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #182230; }
      .line { fill: none; stroke: #536170; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: #7b8796; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .surface { fill: #f5f7fa; stroke: #9aa6b5; stroke-width: 3; }
      .screen { fill: #1d3154; stroke: #7ca6ef; stroke-width: 3; }
      .accent { fill: #fff4df; stroke: #d38a18; stroke-width: 3; }
      .bubble { fill: #ffffff; stroke: #7b8796; stroke-width: 3; }
      .label { font-size: 25px; font-weight: 600; text-anchor: middle; }
      .code { font-size: 18px; fill: #dbeafe; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      @media (prefers-color-scheme: dark) {
        text { fill: #e9eef5; }
        .line { stroke: #aab6c5; }
        .thin { stroke: #91a0b2; }
        .surface { fill: #252f3d; stroke: #718095; }
        .screen { fill: #172744; stroke: #7ca6ef; }
        .accent { fill: #4b3718; stroke: #e3a84c; }
        .bubble { fill: #202936; stroke: #718095; }
      }
    </style>
  </defs>

  <path d="M60 350 H900" class="thin"/>
  <rect x="430" y="220" width="430" height="28" rx="8" class="surface"/>
  <path d="M470 248 V350 M820 248 V350" class="line"/>
  <rect x="610" y="85" width="205" height="125" rx="12" class="screen"/>
  <text x="632" y="128" class="code">model.generate(</text>
  <text x="655" y="160" class="code">prompt</text>
  <text x="632" y="192" class="code">)</text>
  <path d="M712 210 V220 M680 220 H744" class="line"/>
  <rect x="720" y="265" width="105" height="85" rx="10" class="surface"/>
  <rect x="738" y="282" width="69" height="23" rx="6" class="accent"/>
  <circle cx="772" cy="328" r="8" class="screen"/>

  <circle cx="520" cy="185" r="30" class="surface"/>
  <path d="M520 215 V292 M520 235 L570 260 M520 246 L480 278 M520 292 L492 342 M520 292 L551 342" class="line"/>
  <path d="M491 170 Q520 135 548 170" class="thin"/>
  <path d="M570 260 Q620 285 720 305" class="thin" stroke-dasharray="7 8"/>

  <circle cx="225" cy="205" r="34" class="surface"/>
  <path d="M225 239 V330 M225 260 L175 292 M225 262 L300 255 M225 330 L195 350 M225 330 L260 350" class="line"/>
  <path d="M193 192 Q225 150 257 192" class="thin"/>

  <path d="M92 48 H430 Q450 48 450 68 V136 Q450 156 430 156 H292 L258 190 L266 156 H92 Q72 156 72 136 V68 Q72 48 92 48 Z" class="bubble"/>
  <text x="260" y="91" class="label">不用搞那么复杂，</text>
  <text x="260" y="126" class="label">先在你电脑上搞一个出来看看。</text>
</svg>
