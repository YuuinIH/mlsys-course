<svg xmlns="http://www.w3.org/2000/svg" width="960" height="570" aria-labelledby="title desc" role="img" viewBox="0 0 960 570"><title id="title">Stargate 基础设施的五个层次</title><desc id="desc">从钱和组织开始，依次经过土地电力建筑、芯片内存网络存储、训练与推理系统，最终形成工业和国家战略能力。每一层都依赖下方层次。</desc><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 L10 5 L0 10 z" class="arrow-head"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;PingFang SC&quot;,sans-serif;fill:#182230}.layer{stroke-width:2.5}.l1{fill:#f5f7fa;stroke:#9aa6b5}.l2{fill:#edf4ff;stroke:#4d77c7}.l3{fill:#eef8f2;stroke:#4a8c67}.l4{fill:#fff4df;stroke:#d38a18}.l5{fill:#f5efff;stroke:#8061b3}.num,.title{font-weight:600}.num{font-size:25px;text-anchor:middle}.title{font-size:20px}.sub{font-size:15px;fill:#5e6b7a}.flow{fill:none;stroke:#687789;stroke-width:3;marker-end:url(#arrow)}.arrow-head{fill:#687789}@media (prefers-color-scheme:dark){text{fill:#e9eef5}.l1{fill:#252f3d;stroke:#718095}.l2{fill:#1d3154;stroke:#7ca6ef}.l3{fill:#18372a;stroke:#72b48e}.l4{fill:#4b3718;stroke:#e3a84c}.l5{fill:#34264b;stroke:#ad8bdd}.sub{fill:#bac4d1}.flow{stroke:#9aa9bb}.arrow-head{fill:#9aa9bb}}</style></defs><rect width="820" height="82" x="70" y="35" class="layer l1" rx="18"/><circle cx="120" cy="76" r="25" class="layer l1"/><text x="120" y="84" class="num">1</text><text x="165" y="70" class="title">钱和组织</text><text x="165" y="96" class="sub">资本承诺 · 项目公司 · 财务责任 · 运营责任 · 合作伙伴</text><path d="M480 117 V137" class="flow"/><rect width="780" height="82" x="90" y="145" class="layer l2" rx="18"/><circle cx="140" cy="186" r="25" class="layer l2"/><text x="140" y="194" class="num">2</text><text x="185" y="180" class="title">土地、电力和建筑</text><text x="185" y="206" class="sub">园区 · 电网接入 · 变电设施 · 备用电源 · 冷却 · 物理安全</text><path d="M480 227 V247" class="flow"/><rect width="740" height="82" x="110" y="255" class="layer l3" rx="18"/><circle cx="160" cy="296" r="25" class="