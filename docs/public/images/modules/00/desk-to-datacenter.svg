<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">从桌下主机到数据中心</title>
  <desc id="desc">一台办公电脑逐步扩大为八卡服务器、多机集群和数据中心。每个阶段分别突出容量、通信调度、故障和电力等新约束。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="arrow-head"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #182230; }
      .line { fill: none; stroke: #687789; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .flow { fill: none; stroke: #4d77c7; stroke-width: 4; marker-end: url(#arrow); }
      .arrow-head { fill: #4d77c7; }
      .box { fill: #ffffff; stroke: #9aa6b5; stroke-width: 2.5; }
      .accent { fill: #edf4ff; stroke: #4d77c7; stroke-width: 2.5; }
      .warm { fill: #fff4df; stroke: #d38a18; stroke-width: 2.5; }
      .title { font-size: 19px; font-weight: 600; text-anchor: middle; }
      .sub { font-size: 14px; fill: #5e6b7a; text-anchor: middle; }
      @media (prefers-color-scheme: dark) {
        text { fill: #e9eef5; }
        .line { stroke: #9aa9bb; }
        .flow { stroke: #7ca6ef; }
        .arrow-head { fill: #7ca6ef; }
        .box { fill: #202936; stroke: #667386; }
        .accent { fill: #1d3154; stroke: #7ca6ef; }
        .warm { fill: #4b3718; stroke: #e3a84c; }
        .sub { fill: #bac4d1; }
      }
    </style>
  </defs>

  <rect x="25" y="55" width="190" height="245" rx="20" class="box"/>
  <rect x="78" y="98" width="84" height="72" rx="8" class="accent"/>
  <path d="M120 170 V188 M92 188 H148" class="line"/>
  <rect x="92" y="202" width="56" height="65" rx="7" class="box"/>
  <text x="120" y="330" class="title">1 台办公电脑</text>
  <text x="120" y="356" class="sub">约束：放不放得下</text>

  <rect x="270" y="55" width="190" height="245" rx="20" class="box"/>
  <rect x="307" y="90" width="116" height="155" rx="10" class="accent"/>
  <g class="line">
    <path d="M322 116 H408 M322 144 H408 M322 172 H408 M322 200 H408"/>
  </g>
  <circle cx="395" cy="116" r="5" class="warm"/><circle cx="395" cy="144" r="5" class="warm"/><circle cx="395" cy="172" r="5" class="warm"/><circle cx="395" cy="200" r="5" class="warm"/>
  <text x="365" y="330" class="title">1 台多卡服务器</text>
  <text x="365" y="356" class="sub">约束：卡间通信</text>

  <rect x="515" y="55" width="190" height="245" rx="20" class="box"/>
  <g class="accent">
    <rect x="545" y="92" width="52" height="70" rx="7"/><rect x="620" y="92" width="52" height="70" rx="7"/>
    <rect x="545" y="190" width="52" height="70" rx="7"/><rect x="620" y="190" width="52" height="70" rx="7"/>
  </g>
  <path d="M597 127 H620 M571 162 V190 M646 162 V190 M597 225 H620" class="line"/>
  <text x="610" y="330" class="title">多机集群</text>
  <text x="610" y="356" class="sub">约束：调度与故障</text>

  <rect x="760" y="55" width="175" height="245" rx="20" class="box"/>
  <path d="M790 250 V128 L847 84 L905 128 V250 Z" class="accent"/>
  <path d="M812 250 V154 H835 V250 M858 250 V154 H881 V250" class="line"/>
  <path d="M790 128 H905 M803 110 H892" class="line"/>
  <path d="M847 84 V60 M828 60 H866" class="line"/>
  <text x="847.5" y="330" class="title">数据中心</text>
  <text x="847.5" y="356" class="sub">约束：电力与散热</text>

  <path d="M215 178 H270" class="flow"/><path d="M460 178 H515" class="flow"/><path d="M705 178 H760" class="flow"/>
</svg>
