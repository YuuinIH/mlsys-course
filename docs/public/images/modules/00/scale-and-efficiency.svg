<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">规模与效率共同决定可获得的能力</title>
  <desc id="desc">左侧以 Stargate 为代表，通过电力、加速器和数据中心提高资源上限；右侧以 DeepSeek 系统工作为代表，通过模型结构、数值精度、通信重叠和调度提高单位资源效率。两条路径共同汇入最终能力。</desc>
  <defs>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="blue-head"/></marker>
    <marker id="orange-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="orange-head"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #182230; }
      .left { fill: #edf4ff; stroke: #4d77c7; stroke-width: 2.5; }
      .right { fill: #fff4df; stroke: #d38a18; stroke-width: 2.5; }
      .result { fill: #eef8f2; stroke: #4a8c67; stroke-width: 3; }
      .title { font-size: 22px; font-weight: 600; text-anchor: middle; }
      .item { font-size: 16px; text-anchor: middle; }
      .sub { font-size: 14px; fill: #5e6b7a; text-anchor: middle; }
      .blue-flow { fill: none; stroke: #4d77c7; stroke-width: 4; marker-end: url(#blue-arrow); }
      .orange-flow { fill: none; stroke: #d38a18; stroke-width: 4; marker-end: url(#orange-arrow); }
      .blue-head { fill: #4d77c7; }.orange-head { fill: #d38a18; }
      @media (prefers-color-scheme: dark) {
        text { fill: #e9eef5; }
        .left { fill: #1d3154; stroke: #7ca6ef; }
        .right { fill: #4b3718; stroke: #e3a84c; }
        .result { fill: #18372a; stroke: #72b48e; }
        .sub { fill: #bac4d1; }
        .blue-flow { stroke: #7ca6ef; }.orange-flow { stroke: #e3a84c; }
        .blue-head { fill: #7ca6ef; }.orange-head { fill: #e3a84c; }
      }
    </style>
  </defs>

  <rect x="45" y="45" width="360" height="235" rx="24" class="left"/>
  <text x="225" y="86" class="title">扩大资源规模</text>
  <text x="225" y="121" class="sub">Stargate 主要回答：上限能有多高？</text>
  <text x="225" y="166" class="item">更多电力 · 更多加速器</text>
  <text x="225" y="203" class="item">更大网络 · 更多站点</text>
  <text x="225" y="240" class="item">更高资源容量上限</text>

  <rect x="555" y="45" width="360" height="235" rx="24" class="right"/>
  <text x="735" y="86" class="title">提高系统效率</text>
  <text x="735" y="121" class="sub">DeepSeek 主要回答：每张卡能做多少？</text>
  <text x="735" y="166" class="item">MoE · FP8 · 通信重叠</text>
  <text x="735" y="203" class="item">负载均衡 · 并行与调度</text>
  <text x="735" y="240" class="item">更高单位资源有效工作</text>

  <path d="M225 280 V335 H395" class="blue-flow"/>
  <path d="M735 280 V335 H565" class="orange-flow"/>
  <rect x="395" y="305" width="170" height="90" rx="45" class="result"/>
  <text x="480" y="344" class="title">可获得的能力</text>
  <text x="480" y="372" class="sub">规模 × 效率</text>
</svg>
