<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="482" viewBox="0 0 1080 482" role="img" aria-labelledby="title desc">
<title id="title">Strong scaling 与 weak scaling 的对比</title><desc id="desc">左图固定问题总量，更多GPU分摊同一批工作；右图每张GPU工作量固定，增加GPU扩大总处理规模。示意图忽略通信和同步开销。</desc>
<defs><style>
text {font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#233047}
.h1{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#5c6b80}.label{font-size:15px;font-weight:600}
.small{font-size:12.5px;fill:#66768a}.big{font-size:20px;font-weight:700}
.panel{fill:#f6f9fe;stroke:#dce6f4;stroke-width:1.4}.grid{stroke:#dce3ee;stroke-width:1}
.axis{stroke:#7b8ca2;stroke-width:1.5}.dashed{stroke-dasharray:6 7}.blue{stroke:#4275c8;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.gold{stroke:#dc972b;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.green{stroke:#268f79;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.violet{stroke:#895bc5;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.h1{font-size:25px}
@media(prefers-color-scheme:dark){
text{fill:#e9eef7}.sub,.small{fill:#b7c4d6}.panel{fill:#1d2939;stroke:#43516a}
.grid{stroke:#3e4a5c}.axis{stroke:#9aabc0}
.blue{stroke:#82aaff}.gold{stroke:#f2b85a}.green{stroke:#76ceb4}.violet{stroke:#c39ced}
}
</style></defs>
<text x="45" y="48" class="h1">同样增加 GPU，究竟是为了什么？</text>
<text x="45" y="75" class="sub">固定工作量，目标是更快；固定单卡工作量，目标是更大。</text>
<rect class="panel" x="36" y="99" width="492" height="310" rx="20"/>
<rect class="panel" x="552" y="99" width="492" height="310" rx="20"/>
<text x="58" y="132" class="big">Strong scaling</text><text x="58" y="155" class="sub">总工作量固定：4 个工作块</text>
<text x="574" y="132" class="big">Weak scaling</text><text x="574" y="155" class="sub">每张 GPU 工作量固定：1 个工作块</text>
<text x="61" y="211" class="small">1 GPU</text>
<rect x="160" y="183" width="270" height="52" rx="12" fill="#d9e8ff" stroke="#4275c8" stroke-width="1.4"/>
<rect x="180" y="196" width="45" height="25" rx="5" fill="#4275c8"/><rect x="240" y="196" width="45" height="25" rx="5" fill="#4275c8"/><rect x="300" y="196" width="45" height="25" rx="5" fill="#4275c8"/><rect x="360" y="196" width="45" height="25" rx="5" fill="#4275c8"/>
<text x="61" y="334" class="small">4 GPUs</text>
<rect x="160" y="301" width="55" height="55" rx="10" fill="#d9e8ff" stroke="#4275c8" stroke-width="1.3"/><rect x="173" y="315" width="29" height="28" rx="5" fill="#4275c8"/><rect x="230" y="301" width="55" height="55" rx="10" fill="#d9e8ff" stroke="#4275c8" stroke-width="1.3"/><rect x="243" y="315" width="29" height="28" rx="5" fill="#4275c8"/><rect x="300" y="301" width="55" height="55" rx="10" fill="#d9e8ff" stroke="#4275c8" stroke-width="1.3"/><rect x="313" y="315" width="29" height="28" rx="5" fill="#4275c8"/><rect x="370" y="301" width="55" height="55" rx="10" fill="#d9e8ff" stroke="#4275c8" stroke-width="1.3"/><rect x="383" y="315" width="29" height="28" rx="5" fill="#4275c8"/>
<path d="M296 248 L296 280 M289 271 L296 280 L303 271" fill="none" stroke="#7b8ca2" stroke-width="2"/>
<text x="574" y="211" class="small">1 GPU</text>
<rect x="684" y="183" width="67" height="52" rx="10" fill="#dcf4e9" stroke="#268f79" stroke-width="1.4"/>
<rect x="701" y="195" width="32" height="27" rx="5" fill="#268f79"/>
<text x="574" y="334" class="small">4 GPUs</text>
<rect x="684" y="301" width="63" height="55" rx="10" fill="#dcf4e9" stroke="#268f79" stroke-width="1.4"/><rect x="699" y="315" width="33" height="27" rx="5" fill="#268f79"/><rect x="760" y="301" width="63" height="55" rx="10" fill="#dcf4e9" stroke="#268f79" stroke-width="1.4"/><rect x="775" y="315" width="33" height="27" rx="5" fill="#268f79"/><rect x="836" y="301" width="63" height="55" rx="10" fill="#dcf4e9" stroke="#268f79" stroke-width="1.4"/><rect x="851" y="315" width="33" height="27" rx="5" fill="#268f79"/><rect x="912" y="301" width="63" height="55" rx="10" fill="#dcf4e9" stroke="#268f79" stroke-width="1.4"/><rect x="927" y="315" width="33" height="27" rx="5" fill="#268f79"/>
<path d="M825 248 L825 280 M818 271 L825 280 L832 271" fill="none" stroke="#7b8ca2" stroke-width="2"/>
<text x="281" y="383" class="label" text-anchor="middle">总工作量不变</text>
<text x="798" y="383" class="label" text-anchor="middle">总工作量扩大 4×</text>
<text x="45" y="450" class="sub">方块仅代表抽象工作量；不表示执行时间，也不包含通信、同步或调度开销。</text>
</svg>