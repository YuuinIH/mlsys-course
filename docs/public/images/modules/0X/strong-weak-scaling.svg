<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="482" aria-labelledby="title desc" role="img" viewBox="0 0 1080 482"><title id="title">Strong scaling 与 weak scaling 的对比</title><desc id="desc">左图固定问题总量，更多GPU分摊同一批工作；右图每张GPU工作量固定，增加GPU扩大总处理规模。示意图忽略通信和同步开销。</desc><defs><style>text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#233047}.h1{font-weight:700}.sub{font-size:14px;fill:#5c6b80}.label{font-size:15px;font-weight:600}.small{font-size:12.5px;fill:#66768a}.big{font-size:20px;font-weight:700}.panel{fill:#f6f9fe;stroke:#dce6f4;stroke-width:1.4}.h1{font-size:25px}@media (prefers-color-scheme:dark){text{fill:#e9eef7}.small,.sub{fill:#b7c4d6}.panel{fill:#1d2939;stroke:#43516a}}</style></defs><text x="45" y="48" class="h1">同样增加 GPU，究竟是为了什么？</text><text x="45" y="75" class="sub">固定工作量，目标是更快；固定单卡工作量，目标是更大。</text><rect width="492" height="310" x="36" y="99" class="panel" rx="20"/><rect width="492" height="310" x="552" y="99" class="panel" rx="20"/><text x="58" y="132" class="big">Strong scaling</text><text x="58" y="155" class="sub">总工作量固定：4 个工作块</text><text x="574" y="132" class="big">Weak scaling</text><text x="574" y="155" class="sub">每张 GPU 工作量固定：1 个工作块</text><text x="61" y="211" class="small">1 GPU</text><rect width="270" height="52" x="160" y="183" fill="#d9e8ff" stroke="#4275c8" stroke-width="1.4" rx="12"/><rect width="45" height="25" x="180" y="196" fill="#4275c8" rx="5"/><rect width="45" height="25" x="240" y="196" fill="#4275c8" rx="5"/><rect width="45" height="25" x="300" y="196" fill="#4275c8" rx="5"/><rect width="45" height="25" x="360" y="196" fill="#4275c8" rx="5"/><text x="61" y="334" class="small">4 GPUs</text><rect width="55" height="55" x="160" y="301" fill="#d9e8ff" stroke="#4275c8" stroke-width="1.3" rx="10"/><rect width="29" height="28" x="173" y="315" fill="#4275c8" rx="5"/><rect width="55" height="55" x="230" y="301" fill="#d9e8ff" stroke="#4275c8" stroke-width="1.3" rx="10"/><rect width="29" height="28" x="243" y="315" fill="#4275c8" rx="5"/><rect width="55" height="55" x="300" y="301" fill="#d9e8ff" stroke="#4275c8" stroke-width="1.3" rx="10"/><rect width="29" height="28" x="313" y="315" fill="#4275c8" rx="5"/><rect width="55" height="55" x="370" y="301" fill="#d9e8ff" stroke="#4275c8" stroke-width="1.3" rx="10"/><rect width="29" height="28" x="383" y="315" fill="#4275c8" rx="5"/><path fill="none" stroke="#7b8ca2" stroke-width="2" d="M296 248 L296 280 M289 271 L296 280 L303 271"/><text x="574" y="211" class="small">1 GPU</text><rect width="67" height="52" x="684" y="183" fill="#dcf4e9" stroke="#268f79" stroke-width="1.4" rx="10"/><rect width="32" height="27" x="701" y="195" fill="#268f79" rx="5"/><text x="574" y="334" class="small">4 GPUs</text><rect width="63" height="55" x="684" y="301" fill="#dcf4e9" stroke="#268f79" stroke-width="1.4" rx="10"/><rect width="33" height="27" x="699" y="315" fill="#268f79" rx="5"/><rect width="63" height="55" x="760" y="301" fill="#dcf4e9" stroke="#268f79" stroke-width="1.4" rx="10"/><rect width="33" height="27" x="775" y="315" fill="#268f79" rx="5"/><rect width="63" height="55" x="836" y="301" fill="#dcf4e9" stroke="#268f79" stroke-width="1.4" rx="10"/><rect width="33" height="27" x="851" y="315" fill="#268f79" rx="5"/><rect width="63" height="55" x="912" y="301" fill="#dcf4e9" stroke="#268f79" stroke-width="1.4" rx="10"/><rect width="33" height="27" x="927" y="315" fill="#268f79" rx="5"/><path fill="none" stroke="#7b8ca2" stroke-width="2" d="M825 248 L825 280 M818 271 L825 280 L832 271"/><text x="281" y="383" class="label" text-anchor="middle">总工作量不变</text><text x="798" y="383" class="label" text-anchor="middle">总工作量扩大 4×</text><text x="45" y="450" class="sub">方块仅代表抽象工作量；不表示执行时间，也不包含通信、同步或调度开销。</text></svg>