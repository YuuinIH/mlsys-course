<circle cx="856" cy="158" r="6.5" fill="#4275c8" stroke="#fff" stroke-width="1.8"/><text x="881" y="163" class="endpoint">5×</text>
<circle cx="856" cy="265.25" r="6.5" fill="#d48c22" stroke="#fff" stroke-width="1.8"/><text x="881" y="270.25" class="endpoint">3.5×</text>
<circle cx="856" cy="301" r="6.5" fill="#268f79" stroke="#fff" stroke-width="1.8"/><text x="881" y="306" class="endpoint">3×</text>
<circle cx="856" cy="393.95" r="6.5" fill="#8755ba" stroke="#fff" stroke-width="1.8"/><text x="881" y="398.95" class="endpoint">1.7×*</text>
<g>
  <line x1="127" y1="515" x2="157" y2="515" class="curve blue"/><text x="166" y="520" class="legend">训练计算量</text>
  <line x1="319" y1="515" x2="349" y2="515" class="curve gold"/><text x="358" y="520" class="legend">训练成本</text>
  <line x1="480" y1="515" x2="510" y2="515" class="curve green"/><text x="519" y="520" class="legend">计算效率</text>
  <line x1="670" y1="515" x2="700" y2="515" class="curve violet" stroke-dasharray="11 8"/><text x="709" y="520" class="legend">模型能力代理*</text>
</g>
<text x="46" y="570" class="note">* 能力曲线仅供示意：任意假设 ECI 从 20 增加 14 点至 34，以 20 为基数写作 1.7×。</text>
<text x="46" y="589" class="note">ECI 不是可解释比例的智能量，1.7× 不能解读为“智能提高 70%”；指标口径与时间窗各不相同。</text>
</svg>