<path d="M124.0 444.0 L138.9 442.4 L153.9 440.7 L168.8 439.0 L183.8 437.3 L198.7 435.5 L213.6 433.7 L228.6 431.8 L243.5 430.0 L258.4 428.0 L273.4 426.0 L288.3 424.0 L303.3 421.9 L318.2 419.8 L333.1 417.6 L348.1 415.4 L363.0 413.1 L378.0 410.8 L392.9 408.5 L407.8 406.0 L422.8 403.5 L437.7 401.0 L452.7 398.4 L467.6 395.8 L482.5 393.0 L497.5 390.3 L512.4 387.4 L527.3 384.5 L542.3 381.5 L557.2 378.5 L572.2 375.4 L587.1 372.2 L602.0 369.0 L617.0 365.7 L631.9 362.3 L646.9 358.8 L661.8 355.2 L676.7 351.6 L691.7 347.9 L706.6 344.1 L721.6 340.2 L736.5 336.2 L751.4 332.2 L766.4 328.0 L781.3 323.7 L796.2 319.4 L811.2 315.0 L826.1 310.4 L841.1 305.8 L856.0 301.0" class="curve green"/>
