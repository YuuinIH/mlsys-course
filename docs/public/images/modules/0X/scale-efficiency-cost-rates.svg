<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="626" viewBox="0 0 1120 626" role="img" aria-labelledby="title desc">
<title id="title">Agent 任务时长、训练计算量、成本、计算效率的年度增长趋势共用倍率纵轴</title>
<desc id="desc">四条曲线从1倍出发，使用同一个纵坐标轴。Agent 任务时长根据 METR 2023 年以来每131天翻倍的拟合趋势折算为一年约7倍；训练计算量5倍、训练成本3.5倍、预训练计算效率3倍。来源与时间窗口不同，并非统一实验，Task Horizon不等于综合智能增长。</desc>
<defs><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#26354a}
.title{font-size:26px;font-weight:700}.subtitle{font-size:14px;fill:#5a6b80}.label{font-size:16px;font-weight:600}
.tick{font-size:13px;fill:#62758c}.note{font-size:13px;fill:#53667d}.legend{font-size:14px;font-weight:600}
.panel{fill:#f6f9ff;stroke:#dae4f0;stroke-width:1.5}
.grid{stroke:#dce4ef;stroke-width:1}.axis{stroke:#8193a8;stroke-width:1.5}
.curve{fill:none;stroke-width:4.5;stroke-linejoin:round;stroke-linecap:round}
.violet{stroke:#8b5ac5}.blue{stroke:#3f73ca}.gold{stroke:#d18b24}.green{stroke:#248f77}
@media(prefers-color-scheme:dark){
text{fill:#e9eef6}.subtitle,.tick,.note{fill:#bdc9d8}.panel{fill:#1d2a3a;stroke:#43546b}
.grid{stroke:#3d4c61}.axis{stroke:#9bacbf}
.violet{stroke:#c3a0f8}.blue{stroke:#83aaff}.gold{stroke:#edb766}.green{stroke:#7bceb5}
}
</style></defs>
<text x="46" y="49" class="title">投入、效率与能力进步，究竟增长了多少倍？</text>
<text x="46" y="76" class="subtitle">四种指标共用一个倍率坐标系；能力侧选用 Agent 的任务完成时长，不是综合智能指数。</text>
<rect x="43" y="99" width="1033" height="451" rx="20" class="panel"/>
<text x="125" y="139" class="label">相对起点的倍率</text>
<line x1="125" y1="472.0" x2="869" y2="472.0" class="grid"/><text x="107" y="477.0" class="tick" text-anchor="end">1×</text>
<line x1="125" y1="427.6" x2="869" y2="427.6" class="grid"/><text x="107" y="432.6" class="tick" text-anchor="end">2×</text>
<line x1="125" y1="383.1" x2="869" y2="383.1" class="grid"/><text x="107" y="388.1" class="tick" text-anchor="end">3×</text>
<line x1="125" y1="338.7" x2="869" y2="338.7" class="grid"/><text x="107" y="343.7" class="tick" text-anchor="end">4×</text>
<line x1="125" y1="294.3" x2="869" y2="294.3" class="grid"/><text x="107" y="299.3" class="tick" text-anchor="end">5×</text>
<line x1="125" y1="249.9" x2="869" y2="249.9" class="grid"/><text x="107" y="254.9" class="tick" text-anchor="end">6×</text>
<line x1="125" y1="205.4" x2="869" y2="205.4" class="grid"/><text x="107" y="210.4" class="tick" text-anchor="end">7×</text>
<line x1="125" y1="161.0" x2="869" y2="161.0" class="grid"/><text x="107" y="166.0" class="tick" text-anchor="end">8×</text>
<line x1="125" y1="161" x2="125" y2="472" class="axis"/>
<line x1="125" y1="472" x2="869" y2="472" class="axis"/>
<text x="125" y="496" class="tick" text-anchor="middle">起点</text>
<text x="311" y="496" class="tick" text-anchor="middle">3 个月</text>
<text x="497" y="496" class="tick" text-anchor="middle">6 个月</text>
<text x="683" y="496" class="tick" text-anchor="middle">9 个月</text>
<text x="869" y="496" class="tick" text-anchor="middle">一年</text>
