<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="595" viewBox="0 0 1120 595" role="img" aria-labelledby="title desc">
<title id="title">四种AI增长趋势统一在同一倍率坐标轴（能力曲线仅为假设示意）</title>
<desc id="desc">同一个绘图区只使用一个倍率纵轴：训练计算量5倍、训练成本3.5倍、预训练计算效率3倍，模型能力代理指标的曲线1.7倍只是数学演示，假设起点ECI为20、年增量14点。1.7倍不代表智能实际提升70%，也不是实际观测的ECI起点。</desc>
<defs><style>
text {font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#263449}
.head {font-size:26px;font-weight:700}.sub {font-size:14px;fill:#5d6d82}
.axisTitle {font-size:15px;font-weight:600;fill:#405571}
.tick {font-size:13px;fill:#5f7186}.endpoint {font-size:18px;font-weight:700}
.note {font-size:14px;fill:#5b6b80}.legend {font-size:14px;font-weight:600}
.panel {fill:#f7faff;stroke:#dce5f1;stroke-width:1.5}
.axis {stroke:#8596aa;stroke-width:1.6}.grid {stroke:#dae4f0;stroke-width:1}
.curve {fill:none;stroke-width:4.2;stroke-linejoin:round;stroke-linecap:round}
.blue {stroke:#4275c8}.gold {stroke:#d48c22}.green {stroke:#268f79}.violet {stroke:#8755ba}
@media (prefers-color-scheme:dark) {
 text{fill:#e9eef6}.sub,.note,.tick{fill:#c1cbd8}.axisTitle{fill:#d7e1ee}
 .panel{fill:#1b293b;stroke:#3e5066}.grid{stroke:#3b4d61}.axis{stroke:#96aac4}
 .blue{stroke:#83aeff}.gold{stroke:#f6bd62}.green{stroke:#77d3bd}.violet{stroke:#c5a5ff}
}
</style></defs>
<text class="head" x="46" y="49">更多投入、更多效率、更多能力：增长有多快？</text>
<text class="sub" x="46" y="76">四条曲线统一归一化到 1×；能力代理的倍率为假设示意，而非真实“智能倍数”。</text>
<rect x="43" y="96" width="1034" height="449" rx="20" class="panel"/>
<text class="axisTitle" x="124" y="131">相对起点的倍数</text>
<line x1="124" y1="444" x2="856" y2="444" class="grid"/><text x="105" y="449" class="tick" text-anchor="end">1×</text>
<line x1="124" y1="372.5" x2="856" y2="372.5" class="grid"/><text x="105" y="377.5" class="tick" text-anchor="end">2×</text>
<line x1="124" y1="301" x2="856" y2="301" class="grid"/><text x="105" y="306" class="tick" text-anchor="end">3×</text>
<line x1="124" y1="229.5" x2="856" y2="229.5" class="grid"/><text x="105" y="234.5" class="tick" text-anchor="end">4×</text>
<line x1="124" y1="158" x2="856" y2="158" class="grid"/><text x="105" y="163" class="tick" text-anchor="end">5×</text>
<line x1="124" y1="158" x2="124" y2="444" class="axis"/>
<line x1="124" y1="444" x2="856" y2="444" class="axis"/>
<text x="124" y="476" class="tick" text-anchor="middle">起点</text>
<text x="307" y="476" class="tick" text-anchor="middle">3 个月</text>
<text x="490" y="476" class="tick" text-anchor="middle">6 个月</text>
<text x="673" y="476" class="tick" text-anchor="middle">9 个月</text>
<text x="856" y="476" class="tick" text-anchor="middle">1 年</text>
