<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="450" viewBox="0 0 1080 450" role="img" aria-labelledby="title desc">
<title id="title">Gopher 与 Chinchilla 的参数数量和训练 token 数对比</title><desc id="desc">比较 Gopher 280B 参数、约300B token，与 Chinchilla 70B 参数、1.4T token，在接近训练计算预算下的不同分配。参数和token两组使用独立比例尺。</desc>
<defs><style>
text {font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#233047}
.h1{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#5c6b80}.label{font-size:15px;font-weight:600}
.small{font-size:12.5px;fill:#66768a}.big{font-size:20px;font-weight:700}
.panel{fill:#f6f9fe;stroke:#dce6f4;stroke-width:1.4}.grid{stroke:#dce3ee;stroke-width:1}
.axis{stroke:#7b8ca2;stroke-width:1.5}.dashed{stroke-dasharray:6 7}.blue{stroke:#4275c8;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.gold{stroke:#dc972b;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.green{stroke:#268f79;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.violet{stroke:#895bc5;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}

@media(prefers-color-scheme:dark){
text{fill:#e9eef7}.sub,.small{fill:#b7c4d6}.panel{fill:#1d2939;stroke:#43516a}
.grid{stroke:#3e4a5c}.axis{stroke:#9aabc0}
.blue{stroke:#82aaff}.gold{stroke:#f2b85a}.green{stroke:#76ceb4}.violet{stroke:#c39ced}
}
</style></defs>
<text x="46" y="49" class="h1">同样的训练计算预算，可以有不同的分配</text>
<text x="46" y="77" class="sub">Gopher 与 Chinchilla：少一些参数，多一些训练 token（数值取自原论文，示意比例）。</text>
<rect class="panel" x="38" y="99" width="1004" height="313" rx="20"/>
<text x="70" y="139" class="label">模型参数量（B）</text>
<text x="320" y="162" class="small">Gopher · 280B</text>
<rect x="320" y="173" width="580" height="22" rx="6" fill="#d9e8ff"/><rect x="320" y="185" width="560" height="22" rx="6" fill="#4275c8"/>
<text x="320" y="217" class="small">Chinchilla · 70B</text>
<rect x="320" y="228" width="580" height="22" rx="6" fill="#d9e8ff"/><rect x="320" y="247" width="140" height="22" rx="6" fill="#4275c8"/>
<line x1="70" y1="267" x2="998" y2="267" class="grid"/>
<text x="70" y="292" class="label">训练 token（T）</text>
<text x="320" y="305" class="small">Gopher · 0.3T</text>
<rect x="320" y="313" width="580" height="18" rx="6" fill="#dcf4e9"/><rect x="320" y="313" width="119" height="18" rx="6" fill="#268f79"/>
<text x="320" y="351" class="small">Chinchilla · 1.4T</text>
<rect x="320" y="361" width="560" height="18" rx="6" fill="#268f79"/>
<text x="46" y="438" class="sub">蓝色按参数数量比较；绿色按 token 数比较。两种单位不共用比例尺，不能把条长相加。</text>
</svg>