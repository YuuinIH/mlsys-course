<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="450" aria-labelledby="title desc" role="img" viewBox="0 0 1080 450"><title id="title">Gopher 与 Chinchilla 的参数数量和训练 token 数对比</title><desc id="desc">比较 Gopher 280B 参数、约300B token，与 Chinchilla 70B 参数、1.4T token，在接近训练计算预算下的不同分配。参数和token两组使用独立比例尺。</desc><defs><style>text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#233047}.h1{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#5c6b80}.label{font-size:15px;font-weight:600}.small{font-size:12.5px;fill:#66768a}.panel{fill:#f6f9fe;stroke:#dce6f4;stroke-width:1.4}.grid{stroke:#dce3ee;stroke-width:1}@media (prefers-color-scheme:dark){text{fill:#e9eef7}.small,.sub{fill:#b7c4d6}.panel{fill:#1d2939;stroke:#43516a}.grid{stroke:#3e4a5c}}</style></defs><text x="46" y="49" class="h1">同样的训练计算预算，可以有不同的分配</text><text x="46" y="77" class="sub">Gopher 与 Chinchilla：少一些参数，多一些训练 token（数值取自原论文，示意比例）。</text><rect width="1004" height="313" x="38" y="99" class="panel" rx="20"/><text x="70" y="139" class="label">模型参数量（B）</text><text x="320" y="162" class="small">Gopher · 280B</text><rect width="580" height="22" x="320" y="173" fill="#d9e8ff" rx="6"/><rect width="560" height="22" x="320" y="185" fill="#4275c8" rx="6"/><text x="320" y="217" class="small">Chinchilla · 70B</text><rect width="580" height="22" x="320" y="228" fill="#d9e8ff" rx="6"/><rect width="140" height="22" x="320" y="247" fill="#4275c8" rx="6"/><line x1="70" x2="998" y1="267" y2="267" class="grid"/><text x="70" y="292" class="label">训练 token（T）</text><text x="320" y="305" class="small">Gopher · 0.3T</text><rect width="580" height="18" x="320" y="313" fill="#dcf4e9" rx="6"/><rect width="119" height="18" x="320" y="313" fill="#268f79" rx="6"/><text x="320" y="351" class="small">Chinchilla · 1.4T</text><rect width="560" height="18" x="320" y="361" fill="#268f79" rx="6"/><text x="46" y="438" class="sub">蓝色按参数数量比较；绿色按 token 数比较。两种单位不共用比例尺，不能把条长相加。</text></svg>