<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="535" viewBox="0 0 1100 535" role="img" aria-labelledby="title desc">
<title id="title">RadixAttention 共享前缀</title><desc id="desc">不同的请求携带同一段 Token 前缀，Runtime 可以复用该前缀已经计算过的 KV Cache；随后两个请求各自计算不同的后缀并生成回答。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#718298"/></marker><marker id="blue-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#5580cb"/></marker><style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #182536; }
  .title { font-size: 27px; font-weight: 750; }
  .subtitle { font-size: 16px; fill: #596b80; }
  .section { font-size: 20px; font-weight: 700; }
  .main { font-size: 19px; font-weight: 700; }
  .small { font-size: 16px; fill: #53657a; }
  .tiny { font-size: 14px; fill: #66788e; }
  .center { text-anchor: middle; }
  .panel { fill: #ffffff; stroke: #c4cfdd; stroke-width: 1.8; }
  .blue { fill: #edf4ff; stroke: #5580cb; stroke-width: 2; }
  .orange { fill: #fff4df; stroke: #d59b48; stroke-width: 2; }
  .green { fill: #e7f5ed; stroke: #56a27c; stroke-width: 2; }
  .purple { fill: #f3effc; stroke: #9c83cd; stroke-width: 2; }
  .muted { fill: #f3f6fa; stroke: #bcc8d6; stroke-width: 1.7; }
  .muted-dash { fill: #f7f9fc; stroke: #acb8c8; stroke-width: 2; stroke-dasharray: 8 6; }
  .key { font-weight: 700; fill: #315d9c; }
  .connector { fill: none; stroke: #718298; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .blue-connector { fill: none; stroke: #5580cb; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
  .orange-connector { fill: none; stroke: #d59b48; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
  .dashed { stroke-dasharray: 9 8; }
  @media(prefers-color-scheme: dark){
    text {fill:#eef2f8;} .subtitle,.small,.tiny{fill:#b7c4d3;}
    .panel {fill:#1b2533;stroke:#56677b;} .blue {fill:#1e3557;stroke:#84aff7;}
    .orange {fill:#49341b;stroke:#e5ad5c;} .green {fill:#203c2f;stroke:#78c79e;}
    .purple {fill:#322846;stroke:#bb9be4;} .muted {fill:#263141;stroke:#66768a;}
    .muted-dash {fill:#202b39;stroke:#708299;} .key{fill:#a5c8ff;}
    .connector{stroke:#a8b6c6;} .blue-connector{stroke:#86b1f8;} .orange-connector{stroke:#edb663;}
  }</style></defs><text x="48" y="53" class="title">相同前缀，为什么要计算两遍？</text><text x="48" y="81" class="subtitle">两个请求包含相同的 Token 前缀时，可以复用对应的 KV Cache</text><rect x="48" y="103" width="1004" height="102" rx="18" class="panel"/><text x="79" y="134" class="section">可复用的前缀（例如同一段 System Prompt）</text><rect x="114" y="148" width="234" height="42" rx="11" class="blue"/><text x="231" y="175" class="main center">角色设定</text><path d="M352 170 H416" class="blue-connector"/><rect x="424" y="148" width="234" height="42" rx="11" class="blue"/><text x="541" y="175" class="main center">任务规则</text><path d="M662 170 H726" class="blue-connector"/><rect x="734" y="148" width="234" height="42" rx="11" class="blue"/><text x="851" y="175" class="main center">输出格式</text><path d="M850 205 V260 H550 V304" class="blue-connector"/><path d="M550 260 H314 V313" class="blue-connector"/><path d="M550 260 H805 V313" class="blue-connector"/><rect x="92" y="314" width="445" height="139" rx="19" class="green"/><rect x="564" y="314" width="445" height="139" rx="19" class="orange"/><text x="314" y="350" class="section center">请求 A：解释 GIL</text><text x="314" y="383" class="small center">独立计算 A 的后缀</text><text x="314" y="417" class="main center">生成回答 A</text><text x="786" y="350" class="section center">请求 B：解释装饰器</text><text x="786" y="383" class="small center">独立计算 B 的后缀</text><text x="786" y="417" class="main center">生成回答 B</text><text x="550" y="493" class="small center">共享的是相同前缀的计算状态，不是两个请求的最终回答。</text></svg>