<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" aria-labelledby="title desc" role="img" viewBox="0 0 1100 540"><title id="title">固定 Batch 与迭代级调度</title><desc id="desc">上半部分展示固定 Batch 无法及时纳入新请求；下半部分展示 Orca 的迭代级调度在请求完成后移走旧请求、加入新请求。</desc><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="#718298" d="M0 0 L8 4 L0 8Z"/></marker><marker id="blue-arrow" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="#5580cb" d="M0 0 L8 4 L0 8Z"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#182536}.title{font-size:27px;font-weight:750}.subtitle{font-size:16px;fill:#596b80}.main,.section{font-weight:700}.section{font-size:20px}.main{font-size:19px}.small{font-size:16px;fill:#53657a}.tiny{font-size:14px;fill:#66788e}.center{text-anchor:middle}.panel{fill:#fff;stroke:#c4cfdd;stroke-width:1.8}.blue,.orange{fill:#edf4ff;stroke:#5580cb;stroke-width:2}.orange{fill:#fff4df;stroke:#d59b48}.green,.purple{fill:#e7f5ed;stroke:#56a27c;stroke-width:2}.purple{fill:#f3effc;stroke:#9c83cd}.muted{fill:#f3f6fa;stroke:#bcc8d6;stroke-width:1.7}.muted-dash{fill:#f7f9fc;stroke:#acb8c8;stroke-width:2;stroke-dasharray:8 6}.key{font-weight:700;fill:#315d9c}.blue-connector,.connector{fill:none;stroke-linecap:round;stroke-linejoin:round}.connector{stroke:#718298;stroke-width:3}.blue-connector{stroke:#5580cb;stroke-width:3.4}@media (prefers-color-scheme:dark){text{fill:#eef2f8}.small,.subtitle,.tiny{fill:#b7c4d3}.panel{fill:#1b2533;stroke:#56677b}.blue{fill:#1e3557;stroke:#84aff7}.orange{fill:#49341b;stroke:#e5ad5c}.green{fill:#203c2f;stroke:#78c79e}.purple{fill:#322846;stroke:#bb9be4}.muted{fill:#263141;stroke:#66768a}.muted-dash{fill:#202b39;stroke:#708299}.key{fill:#a5c8ff}.connector{stroke:#a8b6c6}.blue-connector{stroke:#86b1f8}}</style></defs><text x="48" y="53" class="title">一个 Batch，为什么不能从头等到尾？</text><text x="48" y="82" class="subtitle">同样是三个执行名额：新的请求何时能加入？（简化示意，不按真实 Token 数量绘制）</text><rect width="1020" height="154" x="40" y="110" class="panel" rx="22"/><text x="68" y="147" class="section">传统固定 Batch</text><text x="68" y="176" class="small">本批次请求集合保持不变</text><rect width="540" height="84" x="302" y="144" class="muted" rx="15"/><text x="320" y="168" class="tiny">Batch #1 · 一直执行到批次结束</text><rect width="128" height="32" x="330" y="181" class="blue" rx="10"/><text x="394" y="204" class="small center">请求 A</text><rect width="128" height="32" x="487" y="181" class="green" rx="10"/><text x="551" y="204" class="small center">请求 B</text><rect width="128" height="32" x="644" y="181" class="purple" rx="10"/><text x="708" y="204" class="small center">请求 C</text><path marker-end="url(#arrow)" d="M845 186 H873" class="connector"/><rect width="131" height="51" x="895" y="165" class="muted-dash" rx="13"/><text x="960" y="187" class="small center">请求 D / E</text><text x="960" y="206" class="tiny center">排队等待</text><rect width="1020" height="207" x="40" y="286" class="panel" rx="22"/><text x="68" y="320" class="section">Orca：按迭代重新调度</text><text x="68" y="346" class="small">每次迭代结束，检查完成的请求并允许新请求进入</text><text x="407" y="329" class="main center">迭代 t₀</text><rect width="202" height="100" x="305" y="353" class="muted" rx="14"/><rect width="53" height="60" x="318" y="373" class="blue" rx="11"/><text x="344" y="409" class="main center">A</text><rect width="53" height="60" x="382" y="373" class="green" rx="11"/><text x="408" y="409" class="main center">B</text><rect width="53" height="60" x="446" y="373" class="purple" rx="11"/><text x="472" y="409" class="main center">C</text><text x="665" y="329" class="main center">迭代 t₁</text><rect width="202" height="100" x="563" y="353" class="muted" rx="14"/><rect width="53" height="60" x="576" y="373" class="green" rx="11"/><text x="602" y="409" class="main center">B</text><rect width="53" height="60" x="640" y="373" class="purple" rx="11"/><text x="666" y="409" class="main center">C</text><rect width="53" height="60" x="704" y="373" class="orange" rx="11"/><text x="730" y="409" class="main center">D</text><text x="923" y="329" class="main center">迭代 t₂</text><rect width="202" height="100" x="821" y="353" class="muted" rx="14"/><rect width="53" height="60" x="834" y="373" class="purple" rx="11"/><text x="860" y="409" class="main center">C</text><rect width="53" height="60" x="898" y="373" class="orange" rx="11"/><text x="924" y="409" class="main center">D</text><rect width="53" height="60" x="962" y="373" class="blue" rx="11"/><text x="988" y="409" class="main center">E</text><path d="M514 405 H549" class="blue-connector"/><text x="532" y="387" class="key center">↗</text><path d="M772 405 H807" class="blue-connector"/><text x="790" y="387" class="key center">↗</text><text x="555" y="481" class="small center">A、B 完成后离开，D、E 按资源容量加入；每一轮 Batch 成员可以不同。</text></svg>