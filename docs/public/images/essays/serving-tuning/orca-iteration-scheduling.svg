<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img" aria-labelledby="title desc">
<title id="title">固定 Batch 与迭代级调度</title><desc id="desc">上半部分展示固定 Batch 无法及时纳入新请求；下半部分展示 Orca 的迭代级调度在请求完成后移走旧请求、加入新请求。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#718298"/></marker><marker id="blue-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#5580cb"/></marker><style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #182536; }
  .title { font-size: 27px; font-weight: 750; }
  .subtitle { font-size: 16px; fill: #596b80; }
  .section { font-size: 20px; font-weight: 700; }
  .main { font-size: 19px; font-weight: 700; }
  .small { font-size: 16px; fill: #53657a; }
  .tiny { font-size: 14px; fill: #66788e; }
  .center { text-anchor: middle; }
  .panel { fill: #ffffff; stroke: #c4cfdd; stroke-width: 1.8; }
  .blue { fill: #edf4ff; stroke: #5580cb; stroke-width: 2; }
  .orange { fill: #fff4df; stroke: #d59b48; stroke-width: 2; }
  .green { fill: #e7f5ed; stroke: #56a27c; stroke-width: 2; }
  .purple { fill: #f3effc; stroke: #9c83cd; stroke-width: 2; }
  .muted { fill: #f3f6fa; stroke: #bcc8d6; stroke-width: 1.7; }
  .muted-dash { fill: #f7f9fc; stroke: #acb8c8; stroke-width: 2; stroke-dasharray: 8 6; }
  .key { font-weight: 700; fill: #315d9c; }
  .connector { fill: none; stroke: #718298; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .blue-connector { fill: none; stroke: #5580cb; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
  .orange-connector { fill: none; stroke: #d59b48; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
  .dashed { stroke-dasharray: 9 8; }
  @media(prefers-color-scheme: dark){
    text {fill:#eef2f8;} .subtitle,.small,.tiny{fill:#b7c4d3;}
    .panel {fill:#1b2533;stroke:#56677b;} .blue {fill:#1e3557;stroke:#84aff7;}
    .orange {fill:#49341b;stroke:#e5ad5c;} .green {fill:#203c2f;stroke:#78c79e;}
    .purple {fill:#322846;stroke:#bb9be4;} .muted {fill:#263141;stroke:#66768a;}
    .muted-dash {fill:#202b39;stroke:#708299;} .key{fill:#a5c8ff;}
    .connector{stroke:#a8b6c6;} .blue-connector{stroke:#86b1f8;} .orange-connector{stroke:#edb663;}
  }</style></defs><text x="48" y="53" class="title">一个 Batch，为什么不能从头等到尾？</text><text x="48" y="82" class="subtitle">同样是三个执行名额：新的请求何时能加入？（简化示意，不按真实 Token 数量绘制）</text><rect x="40" y="110" width="1020" height="154" rx="22" class="panel"/><text x="68" y="147" class="section">传统固定 Batch</text><text x="68" y="176" class="small">本批次请求集合保持不变</text><rect x="302" y="144" width="540" height="84" rx="15" class="muted"/><text x="320" y="168" class="tiny">Batch #1 · 一直执行到批次结束</text><rect x="330" y="181" width="128" height="32" rx="10" class="blue"/><text x="394" y="204" class="small center">请求 A</text><rect x="487" y="181" width="128" height="32" rx="10" class="green"/><text x="551" y="204" class="small center">请求 B</text><rect x="644" y="181" width="128" height="32" rx="10" class="purple"/><text x="708" y="204" class="small center">请求 C</text><path d="M845 186 H873" class="connector" marker-end="url(#arrow)"/><rect x="895" y="165" width="131" height="51" rx="13" class="muted-dash"/><text x="960" y="187" class="small center">请求 D / E</text><text x="960" y="206" class="tiny center">排队等待</text><rect x="40" y="286" width="1020" height="207" rx="22" class="panel"/><text x="68" y="320" class="section">Orca：按迭代重新调度</text><text x="68" y="346" class="small">每次迭代结束，检查完成的请求并允许新请求进入</text><text x="407" y="329" class="main center">迭代 t₀</text><rect x="305" y="353" width="202" height="100" rx="14" class="muted"/><rect x="318" y="373" width="53" height="60" rx="11" class="blue"/><text x="344" y="409" class="main center">A</text><rect x="382" y="373" width="53" height="60" rx="11" class="green"/><text x="408" y="409" class="main center">B</text><rect x="446" y="373" width="53" height="60" rx="11" class="purple"/><text x="472" y="409" class="main center">C</text><text x="665" y="329" class="main center">迭代 t₁</text><rect x="563" y="353" width="202" height="100" rx="14" class="muted"/><rect x="576" y="373" width="53" height="60" rx="11" class="green"/><text x="602" y="409" class="main center">B</text><rect x="640" y="373" width="53" height="60" rx="11" class="purple"/><text x="666" y="409" class="main center">C</text><rect x="704" y="373" width="53" height="60" rx="11" class="orange"/><text x="730" y="409" class="main center">D</text><text x="923" y="329" class="main center">迭代 t₂</text><rect x="821" y="353" width="202" height="100" rx="14" class="muted"/><rect x="834" y="373" width="53" height="60" rx="11" class="purple"/><text x="860" y="409" class="main center">C</text><rect x="898" y="373" width="53" height="60" rx="11" class="orange"/><text x="924" y="409" class="main center">D</text><rect x="962" y="373" width="53" height="60" rx="11" class="blue"/><text x="988" y="409" class="main center">E</text><path d="M514 405 H549" class="blue-connector"/><text x="532" y="387" class="key center">↗</text><path d="M772 405 H807" class="blue-connector"/><text x="790" y="387" class="key center">↗</text><text x="555" y="481" class="small center">A、B 完成后离开，D、E 按资源容量加入；每一轮 Batch 成员可以不同。</text></svg>