<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" aria-labelledby="title desc" role="img" viewBox="0 0 1100 520"><title id="title">PagedAttention 逻辑 Block 与物理 Block</title><desc id="desc">展示单个请求 A 的逻辑 KV Cache 按顺序为 A0 到 A3，但物理 Block 分散位于显存位置 P3、P6、P1、P5。</desc><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="#718298" d="M0 0 L8 4 L0 8Z"/></marker><marker id="blue-arrow" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="#5580cb" d="M0 0 L8 4 L0 8Z"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#182536}.title{font-size:27px;font-weight:750}.subtitle{font-size:16px;fill:#596b80}.main,.section{font-weight:700}.section{font-size:20px}.main{font-size:19px}.small{font-size:16px;fill:#53657a}.tiny{font-size:14px;fill:#66788e}.center{text-anchor:middle}.blue{fill:#edf4ff;stroke:#5580cb;stroke-width:2}.orange,.purple{fill:#fff4df;stroke:#d59b48;stroke-width:2}.purple{fill:#f3effc;stroke:#9c83cd}.muted{fill:#f3f6fa;stroke:#bcc8d6;stroke-width:1.7}.muted-dash{fill:#f7f9fc;stroke:#acb8c8;stroke-width:2;stroke-dasharray:8 6}.blue-connector,.connector{fill:none;stroke-linecap:round;stroke-linejoin:round}.connector{stroke:#718298;stroke-width:3}.blue-connector{stroke:#5580cb;stroke-width:3.4}@media (prefers-color-scheme:dark){text{fill:#eef2f8}.small,.subtitle,.tiny{fill:#b7c4d3}.blue{fill:#1e3557;stroke:#84aff7}.orange{fill:#49341b;stroke:#e5ad5c}.purple{fill:#322846;stroke:#bb9be4}.muted{fill:#263141;stroke:#66768a}.muted-dash{fill:#202b39;stroke:#708299}.connector{stroke:#a8b6c6}.blue-connector{stroke:#86b1f8}}</style></defs><text x="48" y="54" class="title">KV Cache：逻辑连续，不必物理连续</text><text x="48" y="83" class="subtitle">PagedAttention 将请求的 KV Cache 划分为 Block，并维护逻辑到物理的映射（示意）</text><text x="65" y="135" class="section">请求 A 的逻辑 Block 顺序</text><rect width="195" height="83" x="85" y="159" class="blue" rx="17"/><text x="182" y="196" class="main center">A0</text><text x="182" y="222" class="small center">映射到 P3</text><path d="M284 200 H324" class="blue-connector"/><rect width="195" height="83" x="330" y="159" class="blue" rx="17"/><text x="427" y="196" class="main center">A1</text><text x="427" y="222" class="small center">映射到 P6</text><path d="M529 200 H569" class="blue-connector"/><rect width="195" height="83" x="575" y="159" class="blue" rx="17"/><text x="672" y="196" class="main center">A2</text><text x="672" y="222" class="small center">映射到 P1</text><path d="M774 200 H814" class="blue-connector"/><rect width="195" height="83" x="820" y="159" class="blue" rx="17"/><text x="917" y="196" class="main center">A3</text><text x="917" y="222" class="small center">映射到 P5</text><path marker-end="url(#arrow)" d="M550 246 V313" class="connector"/><rect width="266" height="45" x="417" y="261" class="muted" rx="22"/><text x="550" y="289" class="main center">Block 映射关系</text><text x="65" y="359" class="section">GPU 显存中的物理 Block</text><rect width="131" height="81" x="56" y="383" class="orange" rx="12"/><text x="121" y="414" class="tiny center">P0</text><text x="121" y="445" class="main center">B1</text><rect width="131" height="81" x="199" y="383" class="blue" rx="12"/><text x="264" y="414" class="tiny center">P1</text><text x="264" y="445" class="main center">A2</text><rect width="131" height="81" x="342" y="383" class="muted-dash" rx="12"/><text x="407" y="414" class="tiny center">P2</text><text x="407" y="445" class="main center">空闲</text><rect width="131" height="81" x="485" y="383" class="blue" rx="12"/><text x="550" y="414" class="tiny center">P3</text><text x="550" y="445" class="main center">A0</text><rect width="131" height="81" x="628" y="383" class="purple" rx="12"/><text x="693" y="414" class="tiny center">P4</text><text x="693" y="445" class="main center">C0</text><rect width="131" height="81" x="771" y="383" class="blue" rx="12"/><text x="836" y="414" class="tiny center">P5</text><text x="836" y="445" class="main center">A3</text><rect width="131" height="81" x="914" y="383" class="blue" rx="12"/><text x="979" y="414" class="tiny center">P6</text><text x="979" y="445" class="main center">A1</text><text x="550" y="492" class="small center">蓝色为请求 A；其他 Block 可以属于不同请求，空闲 Block 可按需分配。</text></svg>