<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
<title id="title">PagedAttention 逻辑 Block 与物理 Block</title><desc id="desc">展示单个请求 A 的逻辑 KV Cache 按顺序为 A0 到 A3，但物理 Block 分散位于显存位置 P3、P6、P1、P5。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#718298"/></marker><marker id="blue-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#5580cb"/></marker><style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #182536; }
  .title { font-size: 27px; font-weight: 750; }
  .subtitle { font-size: 16px; fill: #596b80; }
  .section { font-size: 20px; font-weight: 700; }
  .main { font-size: 19px; font-weight: 700; }
  .small { font-size: 16px; fill: #53657a; }
  .tiny { font-size: 14px; fill: #66788e; }
  .center { text-anchor: middle; }
  .panel { fill: #ffffff; stroke: #c4cfdd; stroke-width: 1.8; }
  .blue { fill: #edf4ff; stroke: #5580cb; stroke-width: 2; }
  .orange { fill: #fff4df; stroke: #d59b48; stroke-width: 2; }
  .green { fill: #e7f5ed; stroke: #56a27c; stroke-width: 2; }
  .purple { fill: #f3effc; stroke: #9c83cd; stroke-width: 2; }
  .muted { fill: #f3f6fa; stroke: #bcc8d6; stroke-width: 1.7; }
  .muted-dash { fill: #f7f9fc; stroke: #acb8c8; stroke-width: 2; stroke-dasharray: 8 6; }
  .key { font-weight: 700; fill: #315d9c; }
  .connector { fill: none; stroke: #718298; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .blue-connector { fill: none; stroke: #5580cb; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
  .orange-connector { fill: none; stroke: #d59b48; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
  .dashed { stroke-dasharray: 9 8; }
  @media(prefers-color-scheme: dark){
    text {fill:#eef2f8;} .subtitle,.small,.tiny{fill:#b7c4d3;}
    .panel {fill:#1b2533;stroke:#56677b;} .blue {fill:#1e3557;stroke:#84aff7;}
    .orange {fill:#49341b;stroke:#e5ad5c;} .green {fill:#203c2f;stroke:#78c79e;}
    .purple {fill:#322846;stroke:#bb9be4;} .muted {fill:#263141;stroke:#66768a;}
    .muted-dash {fill:#202b39;stroke:#708299;} .key{fill:#a5c8ff;}
    .connector{stroke:#a8b6c6;} .blue-connector{stroke:#86b1f8;} .orange-connector{stroke:#edb663;}
  }</style></defs><text x="48" y="54" class="title">KV Cache：逻辑连续，不必物理连续</text><text x="48" y="83" class="subtitle">PagedAttention 将请求的 KV Cache 划分为 Block，并维护逻辑到物理的映射（示意）</text><text x="65" y="135" class="section">请求 A 的逻辑 Block 顺序</text><rect x="85" y="159" width="195" height="83" rx="17" class="blue"/><text x="182" y="196" class="main center">A0</text><text x="182" y="222" class="small center">映射到 P3</text><path d="M284 200 H324" class="blue-connector"/><rect x="330" y="159" width="195" height="83" rx="17" class="blue"/><text x="427" y="196" class="main center">A1</text><text x="427" y="222" class="small center">映射到 P6</text><path d="M529 200 H569" class="blue-connector"/><rect x="575" y="159" width="195" height="83" rx="17" class="blue"/><text x="672" y="196" class="main center">A2</text><text x="672" y="222" class="small center">映射到 P1</text><path d="M774 200 H814" class="blue-connector"/><rect x="820" y="159" width="195" height="83" rx="17" class="blue"/><text x="917" y="196" class="main center">A3</text><text x="917" y="222" class="small center">映射到 P5</text><path d="M550 246 V313" class="connector" marker-end="url(#arrow)"/><rect x="417" y="261" width="266" height="45" rx="22" class="muted"/><text x="550" y="289" class="main center">Block 映射关系</text><text x="65" y="359" class="section">GPU 显存中的物理 Block</text><rect x="56" y="383" width="131" height="81" rx="12" class="orange"/><text x="121" y="414" class="tiny center">P0</text><text x="121" y="445" class="main center">B1</text><rect x="199" y="383" width="131" height="81" rx="12" class="blue"/><text x="264" y="414" class="tiny center">P1</text><text x="264" y="445" class="main center">A2</text><rect x="342" y="383" width="131" height="81" rx="12" class="muted-dash"/><text x="407" y="414" class="tiny center">P2</text><text x="407" y="445" class="main center">空闲</text><rect x="485" y="383" width="131" height="81" rx="12" class="blue"/><text x="550" y="414" class="tiny center">P3</text><text x="550" y="445" class="main center">A0</text><rect x="628" y="383" width="131" height="81" rx="12" class="purple"/><text x="693" y="414" class="tiny center">P4</text><text x="693" y="445" class="main center">C0</text><rect x="771" y="383" width="131" height="81" rx="12" class="blue"/><text x="836" y="414" class="tiny center">P5</text><text x="836" y="445" class="main center">A3</text><rect x="914" y="383" width="131" height="81" rx="12" class="blue"/><text x="979" y="414" class="tiny center">P6</text><text x="979" y="445" class="main center">A1</text><text x="550" y="492" class="small center">蓝色为请求 A；其他 Block 可以属于不同请求，空闲 Block 可按需分配。</text></svg>