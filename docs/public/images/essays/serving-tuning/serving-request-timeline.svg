<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-labelledby="title desc">
<title id="title">推理请求的时间线与性能指标</title><desc id="desc">客户端从发送请求到首 Token 经历网络、排队和 Prefill，对应 TTFT；之后逐步 Decode 并陆续收到 Token，相邻 Token 的间隔是 ITL；从首 Token 到最后一个 Token 的平均间隔对应 TPOT；从发送到完成的整体时间为端到端延迟。</desc>

<defs><style>
 text {font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#182536}
 .title{font-size:27px;font-weight:750}.sub{font-size:16px;fill:#5b6c80}
 .label{font-size:20px;font-weight:700}.small{font-size:17px;fill:#4e6075}.tiny{font-size:15px;fill:#63758a}
 .center{text-anchor:middle}.panel{fill:#fff;stroke:#c4cfdd;stroke-width:1.6}
 .blue{fill:#e5f0ff;stroke:#5580cb;stroke-width:1.7}.green{fill:#dff3e9;stroke:#56a27c;stroke-width:1.7}
 .orange{fill:#fff0d9;stroke:#db9b45;stroke-width:1.7}.muted{fill:#f2f6fa;stroke:#bcc8d6;stroke-width:1.6}
 .line{stroke:#718298;stroke-width:2.3;fill:none;stroke-linecap:round}.dash{stroke-dasharray:7 7}
 .strongBlue{fill:#4d83d0}.strongGreen{fill:#4e9e77}.strongOrange{fill:#d99c4a}
 @media(prefers-color-scheme:dark){
 text{fill:#edf2fa}.sub,.small,.tiny{fill:#bac6d7}.panel{fill:#1b2533;stroke:#596b7e}
 .blue{fill:#1d3658;stroke:#84aff7}.green{fill:#1e3c30;stroke:#78c79e}
 .orange{fill:#48351e;stroke:#e5ad5c}.muted{fill:#283446;stroke:#667a8e}
 .line{stroke:#a2b3c8}.strongBlue{fill:#79a8e9}.strongGreen{fill:#69be91}.strongOrange{fill:#eab36d}
 }
</style></defs>
<text x="46" y="54" class="title">一个请求有好几种“慢”</text>
<text x="46" y="83" class="sub">横向代表时间顺序；阶段宽度和间隔仅为示意，不对应实际耗时</text>
<rect x="38" y="104" width="1024" height="317" rx="22" class="panel"/>
<text x="64" y="144" class="small">请求处理阶段</text>
<rect x="125" y="162" width="208" height="48" rx="10" class="muted"/>
<rect x="338" y="162" width="194" height="48" rx="10" class="blue"/>
<rect x="537" y="162" width="459" height="48" rx="10" class="green"/>
<text x="229" y="192" class="small center">网络 / 排队 / 处理</text>
<text x="435" y="192" class="small center">Prefill</text>
<text x="769" y="192" class="small center">Decode（逐步生成）</text>
<path d="M125 249 H998" class="line"/><path d="M994 243 L1001 249 L994 255" class="line"/>
<path d="M125 229 V267" class="line"/><circle cx="125" cy="249" r="6" class="strongOrange"/><text x="125" y="286" class="tiny center">发出请求</text>
<path d="M535 229 V267" class="line"/><circle cx="535" cy="249" r="6" class="strongBlue"/><text x="535" y="229" class="tiny center">首 Token</text>
<path d="M675 229 V267" class="line"/><circle cx="675" cy="249" r="6" class="strongGreen"/><text x="675" y="286" class="tiny center">Token 2</text>
<path d="M828 229 V267" class="line"/><circle cx="828" cy="249" r="6" class="strongGreen"/><text x="828" y="286" class="tiny center">Token 3</text>
<path d="M972 229 V267" class="line"/><circle cx="972" cy="249" r="6" class="strongGreen"/><text x="972" y="286" class="tiny center">最后 Token</text>
<path d="M125 315 V327 H535 V315" class="line"/>
<text x="330" y="354" class="label center">TTFT</text>
<path d="M675 305 V317 H828 V305" class="line"/>
<text x="752" y="346" class="label center">ITL</text>
<path d="M535 364 V377 H972 V364" class="line"/>
<text x="753" y="399" class="small center">首 Token 后的平均生成间隔：TPOT</text>
<path d="M125 430 V438 H972 V430" class="line"/>
<text x="550" y="460" class="small center">端到端延迟：发出请求 → 收到完整回答</text>
</svg>