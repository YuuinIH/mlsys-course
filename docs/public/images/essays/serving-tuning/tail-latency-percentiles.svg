<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="456" aria-labelledby="title desc" role="img" viewBox="0 0 1100 456"><title id="title">100 个请求的 TTFT 延迟分布与平均值、P95 对比</title><desc id="desc">模拟的100个请求按 TTFT 从小到大排列，前90个每个0.1秒，后10个每个5秒。平均TTFT为0.59秒，P95为5秒。图中的每根柱代表一个请求，柱高只帮助区分快慢，没有按耗时等比例绘制。</desc><defs><style>text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#182536}.title{font-size:27px;font-weight:750}.sub{font-size:16px;fill:#5b6c80}.small{font-size:17px;fill:#4e6075}.tiny{font-size:15px;fill:#63758a}.center{text-anchor:middle}.panel{fill:#fff;stroke:#c4cfdd;stroke-width:1.6}.blue,.orange{fill:#e5f0ff;stroke:#5580cb;stroke-width:1.7}.orange{fill:#fff0d9;stroke:#db9b45}.line{stroke:#718298;stroke-width:2.3;fill:none;stroke-linecap:round}.dash{stroke-dasharray:7 7}.strongBlue{fill:#4d83d0}.strongOrange{fill:#d99c4a}@media (prefers-color-scheme:dark){text{fill:#edf2fa}.small,.sub,.tiny{fill:#bac6d7}.panel{fill:#1b2533;stroke:#596b7e}.blue{fill:#1d3658;stroke:#84aff7}.orange{fill:#48351e;stroke:#e5ad5c}.line{stroke:#a2b3c8}.strongBlue{fill:#79a8e9}.strongOrange{fill:#eab36d}}</style></defs><text x="46" y="54" class="title">平均 590ms，为什么还有人等了 5 秒？</text><text x="46" y="83" class="sub">教学示例：100 个请求按 TTFT 排序，每根竖条对应一个请求</text><rect width="1024" height="314" x="38" y="104" class="panel" rx="22"/><path d="M104 316 H1000" class="line"/><text x="65" y="154" class="small">5 s</text><text x="65" y="313" class="small">0.1 s</text><path d="M104 150 H1000" class="line dash" opacity=".35"/><rect width="6.8" height="9" x="112" y="305" class="strongBlue" rx="2"/><rect width="6.8" height="9" x="120.5" y="305" class="strongBlue" rx="2"/><rect width="6.8" height="9" x="129.1" y="305" class="strongBlue" rx="2"/><rect width="6.8" height="9" x="137.7" y="305" class="strongBlue" rx="2"/><rect width="6.8" height="9" x="146.2" y="305" class="strongBlue" rx="2"/><rect width="6.8" height="9" x="154.8"