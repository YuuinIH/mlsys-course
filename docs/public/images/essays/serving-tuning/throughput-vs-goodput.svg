<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="448" viewBox="0 0 1100 448" role="img" aria-labelledby="title desc">
<title id="title">吞吐量与有效吞吐量的差别</title><desc id="desc">同样一分钟的模拟压力测试，服务器A完成1200次请求，其中600次满足SLO，有效吞吐10 req/s；服务器B完成900次，其中855次满足SLO，有效吞吐14.25 req/s。A总吞吐更高，B有效吞吐更高。</desc>

<defs><style>
 text {font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#182536}
 .title{font-size:27px;font-weight:750}.sub{font-size:16px;fill:#5b6c80}
 .label{font-size:20px;font-weight:700}.small{font-size:17px;fill:#4e6075}.tiny{font-size:15px;fill:#63758a}
 .center{text-anchor:middle}.panel{fill:#fff;stroke:#c4cfdd;stroke-width:1.6}
 .blue{fill:#e5f0ff;stroke:#5580cb;stroke-width:1.7}.green{fill:#dff3e9;stroke:#56a27c;stroke-width:1.7}
 .orange{fill:#fff0d9;stroke:#db9b45;stroke-width:1.7}.muted{fill:#f2f6fa;stroke:#bcc8d6;stroke-width:1.6}
 .line{stroke:#718298;stroke-width:2.3;fill:none;stroke-linecap:round}.dash{stroke-dasharray:7 7}
 .strongBlue{fill:#4d83d0}.strongGreen{fill:#4e9e77}.strongOrange{fill:#d99c4a}
 @media(prefers-color-scheme:dark){
 text{fill:#edf2fa}.sub,.small,.tiny{fill:#bac6d7}.panel{fill:#1b2533;stroke:#596b7e}
 .blue{fill:#1d3658;stroke:#84aff7}.green{fill:#1e3c30;stroke:#78c79e}
 .orange{fill:#48351e;stroke:#e5ad5c}.muted{fill:#283446;stroke:#667a8e}
 .line{stroke:#a2b3c8}.strongBlue{fill:#79a8e9}.strongGreen{fill:#69be91}.strongOrange{fill:#eab36d}
 }
</style></defs>
<text x="46" y="54" class="title">吞吐更多，不一定让更多请求达标</text>
<text x="46" y="83" class="sub">相同 SLO、相同测试负载、同为 60 秒的教学示例；横条长度代表完成的请求数</text>
<rect x="38" y="106" width="1024" height="303" rx="22" class="panel"/>
<text x="70" y="160" class="label">服务器 A</text>
<text x="70" y="189" class="small">20 req/s</text>
<rect x="280" y="137" width="300" height="69" rx="6" class="strongGreen"/>
<rect x="580" y="137" width="300" height="69" rx="6" class="strongOrange"/>
<text x="430" y="178" class="small center" style="fill:#102b20;font-weight:700">达标 600</text>
<text x="730" y="178" class="small center" style="fill:#432a12;font-weight:700">未达标 600</text>
<text x="903" y="176" class="small">总计 1200</text>
<text x="70" y="286" class="label">服务器 B</text>
<text x="70" y="315" class="small">15 req/s</text>
<rect x="280" y="263" width="427.5" height="69" rx="6" class="strongGreen"/>
<rect x="707.5" y="263" width="22.5" height="69" rx="3" class="strongOrange"/>
<text x="488" y="305" class="small center" style="fill:#102b20;font-weight:700">达标 855</text>
<text x="750" y="306" class="tiny">未达标 45</text>
<text x="903" y="301" class="small">总计 900</text>
<text x="290" y="383" class="small">A 的 Goodput：10 req/s</text>
<text x="667" y="383" class="small">B 的 Goodput：14.25 req/s</text>
<text x="550" y="439" class="tiny center">绿色：完成且满足预设 SLO；橙色：完成但超出延迟要求。不是实测结果。</text>
</svg>