<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" aria-labelledby="title desc" role="img" viewBox="0 0 1100 590"><title id="title">请求到达速率、并发数与完成吞吐量的区别</title><desc id="desc">时间轴从0到7秒。四个请求A、B、C、D分别在0、1、2、3秒到达，都需要3秒完成，因此在3、4、5、6秒完成。0到4秒平均每秒到达1个请求，2.5秒时有3个请求尚未完成，3到7秒平均每秒完成1个请求。这三个指标分别统计到达、某时刻未完成的请求，以及完成。</desc><defs><style>text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#182536}.heading{font-size:27px;font-weight:740}.sub{font-size:16px;fill:#596b80}.body{font-size:19px;font-weight:650}.small{font-size:16px;fill:#53657a}.tiny{font-size:14px;fill:#65768a}.center{text-anchor:middle}.panel{fill:#fff;stroke:#c4cfdd;stroke-width:1.7}.grid{stroke:#d5deea;stroke-width:1.2;stroke-dasharray:4 6}.active{fill:#e5f0ff;stroke:#5580cb;stroke-width:1.7}.blueFill{fill:#537fc5}.greenFill{fill:#4fa17c}.highlight{stroke:#d59b48;stroke-width:2.6;stroke-dasharray:7 6}.cardBlue{fill:#edf4ff;stroke:#5580cb}.cardBlue,.cardGreen,.cardOrange{stroke-width:1.6}.cardOrange{fill:#fff3e0;stroke:#d59b48}.cardGreen{fill:#e8f6ef;stroke:#56a27c}.metric{font-size:24px;font-weight:760}.metricTitle{font-size:17px;font-weight:690}@media (prefers-color-scheme:dark){text{fill:#edf2fa}.small,.sub,.tiny{fill:#bdc9d9}.panel{fill:#1b2533;stroke:#586b82}.grid{stroke:#46566d}.active{fill:#203b5d;stroke:#8cb4f7}.blueFill{fill:#91b9fa}.greenFill{fill:#7bd3a3}.highlight{stroke:#f5ba65}.cardBlue{fill:#203855;stroke:#84aff7}.cardOrange{fill:#44351f;stroke:#f0bb70}.cardGreen{fill:#213f32;stroke:#79c9a1}}</style></defs><text x="44" y="52" class="heading">请求怎么来、同时有多少、最后完成多少？</text><text x="44" y="81" class="sub">四个请求依次到达，每个请求从到达到完成都持续 3 秒</text><rect width="1026" height="344" x="37" y="104" class="panel" rx="20"/><text x="64" y="147" class="small">请求</text><text x="166" y="147" class="small">时间轴（秒）</text><line x1="180" x2="180" y1="156" y2="419" class="grid"/><text x="180" y="144" class="small center">0</text><line x1="286" x2="286" y1="156" y2="419" class="grid"/><text x="286" y="144" class="small center">1</text><line x1="392" x2="392" y1="156" y2="419" class="grid"/><text x="392" y="144" class="small center">2</text><line x1="498" x2="498" y1="156" y2="419" class="grid"/><text x="498" y="144" class="small center">3</text><line x1="604" x2="604" y1="156" y2="419" class="grid"/><text x="604" y="144" class="small center">4</text><line x1="710" x2="710" y1="156" y2="419" class="grid"/><text x="710" y="144" class="small center">5</text><line x1="816" x2="816" y1="156" y2="419" class="grid"/><text x="816" y="144" class="small center">6</text><line x1="922" x2="922" y1="156" y2="419" class="grid"/><text x="922" y="144" class="small center">7</text><rect width="106" height="251" x="392" y="162" fill="#d59b48" opacity=".09" rx="10"/><line x1="445" x2="445" y1="158" y2="422" class="highlight"/><text x="445" y="442" class="tiny center">t = 2.5 s</text><text x="88" y="200" class="body center">请求 A</text><rect width="318" height="38" x="180" y="174" class="active" rx="9"/><circle cx="180" cy="193" r="7" class="blueFill"/><circle cx="498" cy="193" r="7" class="greenFill"/><text x="339" y="199" class="small center">执行中</text><text x="88" y="262" class="body center">请求 B</text><rect width="318" height="38" x="286" y="236" class="active" rx="9"/><circle cx="286" cy="255" r="7" class="blueFill"/><circle cx="604" cy="255" r="7" class="greenFill"/><text x="445" y="261" class="small center">执行中</text><text x="88" y="324" class="body center">请求 C</text><rect width="318" height="38" x="392" y="298" class="active" rx="9"/><circle cx="392" cy="317" r="7" class="blueFill"/><circle cx="710" cy="317" r="7" class="greenFill"/><text x="551" y="323" class="small center">执行中</text><text x="88" y="386" class="body center">请求 D</text><rect width="318" height="38" x="498" y="360" class="active" rx="9"/><circle cx="498" cy="379" r="7" class="blueFill"/><circle cx="816" cy="379" r="7" class="greenFill"/><text x="657" y="385" class="small center">执行中</text><circle cx="724" cy="123" r="6" class="blueFill"/><text x="737" y="128" class="tiny">请求到达</text><circle cx="855" cy="123" r="6" class="greenFill"/><text x="868" y="128" class="tiny">请求完成</text><rect width="316" height="100" x="42" y="470" class="cardBlue" rx="17"/><rect width="316" height="100" x="392" y="470" class="cardOrange" rx="17"/><rect width="316" height="100" x="742" y="470" class="cardGreen" rx="17"/><text x="200" y="501" class="metricTitle center">到达速率 · 0～4 秒</text><text x="200" y="533" class="metric center">1 req/s</text><text x="200" y="556" class="tiny center">共到达 4 个请求</text><text x="550" y="501" class="metricTitle center">并发数 · t = 2.5 秒</text><text x="550" y="533" class="metric center">3 个请求</text><text x="550" y="556" class="tiny center">A、B、C 尚未完成</text><text x="900" y="501" class="metricTitle center">完成吞吐量 · 3～7 秒</text><text x="900" y="533" class="metric center">1 req/s</text><text x="900" y="556" class="tiny center">共完成 4 个请求</text></svg>