<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="694" viewBox="0 0 1100 694" role="img" aria-labelledby="title desc">
  <title id="title">35 个 Token 怎样取得三个 KV Block</title>
  <desc id="desc">请求 A 的逻辑块 0、1、2 分别映射到物理池中的 P3、P6、P1。每块容纳 16 个 Token，最后一块保存 3 个 Token，剩下 13 个空位。其他空闲物理块仍可分配给别的请求。</desc>
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#182536}
      .title{font-size:27px;font-weight:750}.sub{font-size:18px;fill:#5b6c80}.label{font-size:21px;font-weight:700}.small{font-size:19px;fill:#4e6075}
      .panel{fill:#fff;stroke:#c4cfdd;stroke-width:1.6}.free{fill:#f2f6fa;stroke:#91a6c1;stroke-width:1.4}
      .first{fill:#4d83d0}.second{fill:#368573}.third{fill:#bd7833}.tail{fill:url(#hatch);stroke:#bd7833;stroke-width:1}
      .cells{stroke:#fff;stroke-width:1.5}.route{fill:none;stroke-width:3;stroke-linecap:round}.r0{stroke:#4d83d0}.r1{stroke:#368573}.r2{stroke:#bd7833}
      .halo{fill:none;stroke:#fff;stroke-width:9}.hatch-line{stroke:#bd7833;stroke-width:1.2}.hatch-bg{fill:#faf0df}.text-bg{fill:#fff}.onblock{fill:#fff}
      @media(prefers-color-scheme:dark){
        text{fill:#edf2fa}.sub,.small{fill:#bac6d7}.panel{fill:#1b2533;stroke:#596b7e}.free{fill:#283446;stroke:#849ab5}
        .first{fill:#79a8e9}.second{fill:#77c8ad}.third{fill:#e6b568}.r0{stroke:#79a8e9}.r1{stroke:#77c8ad}.r2,.hatch-line{stroke:#e6b568}
        .tail{stroke:#e6b568}.hatch-bg{fill:#463b2d}.cells{stroke:#1b2533}.halo{stroke:#1b2533}.text-bg{fill:#1b2533}.onblock{fill:#182536}
      }
    </style>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" class="hatch-bg"/><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" class="hatch-line"/></pattern>
    <marker id="arrow0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" class="first"/></marker>
    <marker id="arrow1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" class="second"/></marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" class="third"/></marker>
    <path id="slots" d="M18 0v38M36 0v38M54 0v38M72 0v38M90 0v38M108 0v38M126 0v38M144 0v38M162 0v38M180 0v38M198 0v38M216 0v38M234 0v38M252 0v38M270 0v38"/>
  </defs>
  <text x="42" y="53" class="title">顺序属于请求，位置由缓存池安排</text>
  <text x="42" y="84" class="sub">请求 A 已计算 35 个 Token · 每 Block 容纳 16 个 Token</text>
  <rect x="34" y="106" width="1032" height="500" rx="20" class="panel"/>
  <text x="64" y="151" class="label">请求 A 的逻辑 Block</text>
  <text x="700" y="139" class="label">物理 Block 池（局部）</text>

  <text x="64" y="200" class="small">Block 0 · Token 1～16</text>
  <rect x="64" y="212" width="288" height="38" rx="3" class="first"/>
  <use href="#slots" x="64" y="212" class="cells"/>
  <text x="370" y="239" class="small">16 / 16</text>

  <text x="64" y="330" class="small">Block 1 · Token 17～32</text>
  <rect x="64" y="342" width="288" height="38" rx="3" class="second"/>
  <use href="#slots" x="64" y="342" class="cells"/>
  <text x="370" y="369" class="small">16 / 16</text>

  <text x="64" y="460" class="small">Block 2 · Token 33～35</text>
  <rect x="64" y="472" width="288" height="38" rx="3" class="tail"/>
  <rect x="64" y="472" width="54" height="38" rx="3" class="third"/>
  <use href="#slots" x="64" y="472" class="cells"/>
  <text x="370" y="499" class="small">3 / 16</text>
  <text x="64" y="543" class="small">斜线部分：尾块的 13 个空位</text>

  <path d="M456 231C560 231 570 335 687 335" class="route r0" marker-end="url(#arrow0)"/>
  <path d="M456 361C570 361 570 503 687 503" class="route r1" marker-end="url(#arrow1)"/>
  <path d="M456 491C620 491 525 223 687 223" class="halo"/>
  <path d="M456 491C620 491 525 223 687 223" class="route r2" marker-end="url(#arrow2)"/>

  <rect x="700" y="145" width="326" height="44" rx="5" class="free"/><text x="717" y="174" class="small">P0 · 空闲，可分配</text>
  <rect x="700" y="201" width="326" height="44" rx="5" class="tail"/><rect x="700" y="201" width="61.125" height="44" rx="5" class="third"/><rect x="773" y="207" width="172" height="32" rx="3" class="text-bg"/><text x="778" y="230" class="small">P1 · A 的尾块</text>
  <rect x="700" y="257" width="326" height="44" rx="5" class="free"/><text x="717" y="286" class="small">P2 · 空闲，可分配</text>
  <rect x="700" y="313" width="326" height="44" rx="5" class="first"/><text x="717" y="342" class="label onblock">P3 · A 的 Block 0</text>
  <rect x="700" y="369" width="326" height="44" rx="5" class="free"/><text x="717" y="398" class="small">P4 · 空闲，可分配</text>
  <rect x="700" y="425" width="326" height="44" rx="5" class="free"/><text x="717" y="454" class="small">P5 · 空闲，可分配</text>
  <rect x="700" y="481" width="326" height="44" rx="5" class="second"/><text x="717" y="510" class="label onblock">P6 · A 的 Block 1</text>
  <rect x="700" y="537" width="326" height="44" rx="5" class="free"/><text x="717" y="566" class="small">P7 · 空闲，可分配</text>

  <text x="42" y="646" class="small">35 个 Token → 3 Blocks → 48 个位置</text>
  <text x="42" y="675" class="sub">尾块内的空位随 A 继续生成而填满；池内空闲块可交给其他请求。</text>
</svg>
